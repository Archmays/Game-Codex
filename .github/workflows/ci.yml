name: Portfolio CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_scroll_matrix:
        description: Run the full registered-surface scroll matrix across all seven viewports
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for affected browser profiles
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify portfolio manifest and generated documentation
        run: pnpm run portfolio:check

      - name: Verify Portfolio Evolution evidence schema and generated audit
        run: pnpm run portfolio:evolution:check

      - name: Validate play-readiness lifecycle, surfaces, saves, assets, and privacy
        run: pnpm run validate:play-readiness

      - name: Validate UI occlusion inventory and interaction-integrity contracts
        run: pnpm run validate:play-surface-integrity

      - name: Prove natural-use observation privacy defaults and storage isolation
        run: pnpm run test:privacy:natural-use-kit

      - name: Run affected gate tier
        run: pnpm run test:portfolio:affected -- --base "${{ github.event.pull_request.base.sha || github.event.before }}" --head "${{ github.sha }}" --run

      - name: Run unit, content, and maintenance safety tests
        run: pnpm test

      - name: Validate canonical Pinyin and shared memory contracts
        run: pnpm run validate:chinese-support

      - name: Validate English V2 content reports
        run: pnpm run reports:english-v2 && git diff --exit-code -- docs/english-v2/release public/assets/english-world/asset-manifest.json

      - name: Typecheck and production build
        run: pnpm build

  all-game-smoke:
    needs: deterministic-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise all games and public routes in both viewports
        run: pnpm run test:portfolio:smoke

      - name: Exercise portfolio first-use, return, reload, and resume smoke
        run: pnpm run test:e2e:play-readiness:smoke

      - name: Exercise representative registered-surface hit-test matrix
        run: pnpm run test:e2e:hittest:representative

      - name: Exercise representative scroll ownership, reachability, and modal restoration
        run: pnpm run test:e2e:scroll-reachability:representative

      - name: Exercise parent-only natural-use observation flow
        run: pnpm run test:e2e:natural-use-kit

      - name: Exercise Math World routes, interactions, saves, and lifecycle
        run: pnpm run test:e2e:math-world

      - name: Exercise Chinese support routes, inputs, saves, and fallbacks
        run: pnpm run test:e2e:chinese-support

      - name: Exercise English World routes, missions, saves, and geometry
        run: pnpm run test:e2e:english-v2

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-smoke-failure-${{ github.sha }}
          path: |
            test-results/portfolio-smoke
            test-results/math-world
            test-results/chinese-support
            test-results/english-v2
            test-results/play-readiness
            test-results/interaction-integrity
            test-results/scroll-reachability
          if-no-files-found: ignore
          retention-days: 7

  full-scroll-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.full_scroll_matrix
    needs: deterministic-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise all registered surfaces across all seven viewports
        run: pnpm exec playwright test --config playwright.scroll-reachability.config.ts --grep @full

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-scroll-matrix-failure-${{ github.sha }}
          path: test-results/scroll-reachability
          if-no-files-found: ignore
          retention-days: 7
