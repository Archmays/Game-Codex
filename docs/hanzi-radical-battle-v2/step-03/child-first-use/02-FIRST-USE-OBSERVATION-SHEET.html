<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STEP 03 儿童首次使用观察表</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #0f2f35; color: #f1fbf7; }
      body { margin: 0 auto; max-width: 880px; padding: 24px; line-height: 1.55; }
      h1 { font-size: clamp(1.45rem, 4vw, 2rem); }
      .notice { border: 2px solid #76dfcf; background: #173f46; border-radius: 16px; padding: 14px; }
      fieldset { border: 1px solid #527a83; border-radius: 14px; margin: 16px 0; padding: 16px; }
      label { display: grid; gap: 6px; margin: 12px 0; }
      input, select, textarea, button { min-height: 44px; border-radius: 10px; border: 1px solid #7da7aa; padding: 8px 10px; font: inherit; }
      input, select, textarea { background: #f7fffc; color: #123238; }
      button { background: #7ee8d6; color: #102e34; font-weight: 800; cursor: pointer; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 18px; }
      .status { min-height: 1.5em; color: #ffd0c8; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>STEP 03 儿童首次使用观察表</h1>
    <p class="notice">仅在 guarded launcher 已核验家长明确授权后使用。本表不录音、不录像、不上传，不收集姓名、年龄、学校或设备身份。观察不是成绩。</p>
    <form id="sheet">
      <fieldset>
        <legend>身份绑定</legend>
        <div class="grid">
          <label>Review identity<input name="reviewIdentity" required minlength="12" autocomplete="off" /></label>
          <label>Run seed<input name="runSeed" required minlength="4" autocomplete="off" /></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>可观察节点</legend>
        <div id="observations" class="grid"></div>
      </fieldset>
      <fieldset>
        <legend>过程</legend>
        <label>介入（可多选）<select name="interventions" multiple size="4"><option>NONE</option><option>REPEAT_VISIBLE_COPY</option><option>POINT_TO_REGION_ONLY</option><option>STOPPED</option></select></label>
        <label><input type="checkbox" name="childQuestionsAsked" /> 结束后问了两条可选问题</label>
        <label>停止代码<select name="stopCode"><option value="">没有停止</option><option>CHILD_REQUEST</option><option>DISTRESS</option><option>SENSORY_DISCOMFORT</option><option>TECHNICAL</option><option>PRIVACY</option><option>IDENTITY</option><option>ADULT_ANSWER_REQUIRED</option><option>OTHER</option></select></label>
        <label><input type="checkbox" name="completed" /> 到达本次 run 末尾</label>
        <label>非身份性观察备注<textarea name="observerNotes" maxlength="1000" rows="5" placeholder="只写可观察行为，不写姓名、年龄、学校、联系方式。"></textarea></label>
        <label><input type="checkbox" name="privacyConfirmed" required /> 已检查：不含个人身份、照片、录音或录像</label>
      </fieldset>
      <button type="submit">导出本地 JSON</button>
      <p class="status" id="status" role="status"></p>
    </form>
    <script>
      const keys = ["firstScreen", "firstSpell", "secondStructure", "ability", "bossIntent", "failureLanguage", "campRepair", "spellbook"];
      const labels = ["首屏", "首次施法", "第二种结构", "能力", "Boss intent", "失败语言", "营地修复", "魔法书"];
      const values = ["NOT_REACHED", "NOTICED_WITHOUT_PROMPT", "NOTICED_AFTER_BUILT_IN_SUPPORT", "ADULT_REGION_PROMPT", "STOPPED"];
      const host = document.querySelector("#observations");
      keys.forEach((key, index) => {
        const label = document.createElement("label");
        label.textContent = labels[index];
        const select = document.createElement("select");
        select.name = key;
        values.forEach((value) => { const option = document.createElement("option"); option.value = value; option.textContent = value; select.append(option); });
        label.append(select); host.append(label);
      });
      document.querySelector("#sheet").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const data = new FormData(form);
        const payload = {
          schemaVersion: 1,
          reviewIdentity: String(data.get("reviewIdentity")),
          sessionId: `local-${crypto.randomUUID()}`,
          runSeed: String(data.get("runSeed")),
          startedAt: new Date().toISOString(),
          completed: data.get("completed") === "on",
          stopCode: data.get("stopCode") || null,
          observations: Object.fromEntries(keys.map((key) => [key, data.get(key)])),
          interventions: data.getAll("interventions"),
          childQuestionsAsked: data.get("childQuestionsAsked") === "on",
          privacyConfirmed: data.get("privacyConfirmed") === "on",
          observerNotes: String(data.get("observerNotes") || "")
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "STEP-03_CHILD_FIRST_USE_OBSERVATION.json"; link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        document.querySelector("#status").textContent = "已在本机导出；请先检查隐私，再按回传合同处理。";
      });
    </script>
  </body>
</html>
