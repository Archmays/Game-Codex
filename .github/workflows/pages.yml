name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify portfolio manifest and generated documentation
        run: pnpm run portfolio:check

      - name: Run unit, content, and maintenance safety tests
        run: pnpm test

      - name: Build static site
        run: pnpm build
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise the exact production build across the portfolio
        run: pnpm run test:portfolio:smoke
        env:
          PORTFOLIO_SMOKE_PREVIEW: "1"

      - name: Validate Math World models, catalog replacement, and browser lifecycle
        run: pnpm run validate:math-world && pnpm run test:e2e:math-world

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-portfolio-failure-${{ github.sha }}
          path: |
            test-results/portfolio-smoke
            test-results/math-world
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
