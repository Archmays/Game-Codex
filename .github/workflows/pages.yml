name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify portfolio manifest and generated documentation
        run: pnpm run portfolio:check

      - name: Validate play-readiness lifecycle, surfaces, saves, assets, and privacy
        run: pnpm run validate:play-readiness

      - name: Validate UI occlusion inventory and interaction-integrity contracts
        run: pnpm run validate:interaction-integrity

      - name: Prove natural-use observation privacy defaults and storage isolation
        run: pnpm run test:privacy:natural-use-kit

      - name: Run unit, content, and maintenance safety tests
        run: pnpm test

      - name: Validate canonical Pinyin and shared memory contracts
        run: pnpm run validate:chinese-support

      - name: Validate English V2 content reports
        run: pnpm run reports:english-v2 && git diff --exit-code -- docs/english-v2/release public/assets/english-world/asset-manifest.json

      - name: Build static site
        run: pnpm build
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise the exact production build across the portfolio
        run: pnpm run test:portfolio:smoke
        env:
          PORTFOLIO_SMOKE_PREVIEW: "1"

      - name: Exercise portfolio first-use, return, reload, and resume smoke
        run: pnpm run test:e2e:play-readiness:smoke

      - name: Exercise representative 42-surface hit-test matrix
        run: pnpm run test:e2e:hittest:representative
        env:
          INTERACTION_INTEGRITY_PREVIEW: "1"

      - name: Exercise parent-only natural-use observation flow
        run: pnpm run test:e2e:natural-use-kit

      - name: Validate Math World models, catalog replacement, and browser lifecycle
        run: pnpm run validate:math-world && pnpm run test:e2e:math-world

      - name: Validate Chinese support routes and interactions
        run: pnpm run test:e2e:chinese-support

      - name: Validate English World routes, missions, saves, and geometry
        run: pnpm run test:e2e:english-v2

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-portfolio-failure-${{ github.sha }}
          path: |
            test-results/portfolio-smoke
            test-results/math-world
            test-results/chinese-support
            test-results/english-v2
            test-results/play-readiness
            test-results/interaction-integrity
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
