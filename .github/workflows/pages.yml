name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_CODEX_TASK_ID: GAME-CODEX-V1.0
      GAME_CODEX_EVIDENCE_ROOT: tmp/tasks/GAME-CODEX-V1.0
      TD_EVIDENCE_DIR: tmp/tasks/GAME-CODEX-V1.0/tower
      HWAY_EVIDENCE: tmp/tasks/GAME-CODEX-V1.0/adventure
      HWAY_EVIDENCE_DIR: tmp/tasks/GAME-CODEX-V1.0/adventure
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify portfolio manifest and generated documentation
        run: pnpm run portfolio:check

      - name: Verify Portfolio Evolution evidence schema and generated audit
        run: pnpm run portfolio:evolution:check

      - name: Validate play-readiness lifecycle, surfaces, saves, assets, and privacy
        run: pnpm run validate:play-readiness

      - name: Validate UI occlusion inventory and interaction-integrity contracts
        run: pnpm run validate:interaction-integrity

      - name: Prove natural-use observation privacy defaults and storage isolation
        run: pnpm run test:privacy:natural-use-kit

      - name: Run unit, content, and maintenance safety tests
        run: pnpm test

      - name: Validate independent memory and tower defense balance
        run: pnpm run test:memory-match && pnpm run validate:hanzi-tower-defense
        env:
          TD_EVIDENCE_DIR: tmp/tasks/GAME-CODEX-V1.0/tower

      - name: Build static site
        run: pnpm build
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise full keyboard, mouse and touch loops across shared surfaces
        run: pnpm run test:e2e:step4 --project=desktop --project=phone-390 --grep "@primary|@step5-entry|@step5-keypath"

      - name: Exercise the exact production build across the portfolio
        run: pnpm run test:portfolio:smoke
        env:
          PORTFOLIO_SMOKE_PREVIEW: "1"

      - name: Exercise portfolio first-use, return, reload, and resume smoke
        run: pnpm run test:e2e:play-readiness:smoke

      - name: Exercise representative registered-surface hit-test matrix
        run: pnpm run test:e2e:hittest:representative
        env:
          INTERACTION_INTEGRITY_PREVIEW: "1"

      - name: Exercise parent-only natural-use observation flow
        run: pnpm run test:e2e:natural-use-kit

      - name: Validate Math World models, catalog replacement, and browser lifecycle
        run: pnpm run validate:math-world && pnpm run test:e2e:math-world

      - name: Validate Hanzi tower defense full battle and controls
        run: pnpm run test:e2e:hanzi-tower-defense
        env:
          TD_EVIDENCE_DIR: tmp/tasks/GAME-CODEX-V1.0/tower

      - name: Validate twenty adventure rooms and ordinary four-chapter play
        run: pnpm run validate:hanzi-word-adventure && pnpm exec tsx games/hanzi-word-adventure/tools/solve-step5.ts && pnpm run test:e2e:hanzi-word-adventure

      - name: Validate two builds and placements on both new defense maps
        run: pnpm exec tsx tools/hanzi-tower-defense/step4-balance.ts --write && pnpm exec tsx tools/hanzi-tower-defense/check-placement.ts

      - name: Validate two builds, weak layouts, and resonance in six tactical scenarios
        run: pnpm exec tsx tools/hanzi-tower-defense/step5-balance.ts --write

      - name: Verify v1.0 presentation, media, and recovery
        run: pnpm exec playwright test --config playwright.v1.config.ts --project=desktop --project=phone-390

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-portfolio-failure-${{ github.sha }}
          path: |
            tmp/tasks/GAME-CODEX-V1.0
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
